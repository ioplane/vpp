name: PVS-Studio NAT and IKE

on:
  workflow_dispatch:
  push:
    branches: [ci/pvs-studio-2026-10-24]

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'ioplane/vpp'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/pvs-studio-2026-10-24
          fetch-depth: 100
          fetch-tags: true
          persist-credentials: false
      - name: Require the license secret
        env:
          PVS_LICENSE_B64: ${{ secrets.PVS_LICENSE_B64 }}
        run: test -n "$PVS_LICENSE_B64"
      - name: Record analyzed source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the isolated analysis image
        run: |
          podman build --build-arg GIT_SHA="$(git rev-parse HEAD)" \
            --build-arg VPP_DESCRIBE="$(git describe --long --match 'v*')" \
            --build-arg CREATED="$(date -u +%FT%TZ)" \
            --memory 6g --cpu-period 100000 --cpu-quota 200000 \
            --ignorefile .ci/pvs/context.ignore \
            -t localhost/vpp-pvs -f .ci/pvs/Containerfile .
      - name: Analyze with runtime-only credentials
        env:
          PVS_LICENSE_B64: ${{ secrets.PVS_LICENSE_B64 }}
        run: |
          podman create --name "pvs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --network none --read-only --cpus 2 --memory 3g \
            --tmpfs /run/pvs:rw,noexec,nosuid,size=256m --env PVS_LICENSE_B64 \
            --volume /work/pvs-report \
            localhost/vpp-pvs python3 .ci/pvs/analyze.py
          podman start --attach "pvs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retrieve reports and remove the licensed container
        if: always()
        run: |
          name="pvs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if podman container exists "$name"; then
            copy_status=0
            podman cp "$name:/work/pvs-report" ./pvs-report || copy_status=$?
            podman rm --force --volumes "$name"
            exit "$copy_status"
          fi
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: pvs-report/vpp.sarif
          category: pvs-nat-ike
          checkout_path: /work
          ref: refs/heads/ci/pvs-studio-2026-10-24
          sha: ${{ steps.source.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pvs-nat-ike
          path: pvs-report/
          if-no-files-found: ignore
          retention-days: 14
